@keyframes strips-b{0%,35.83%{top:-89.285%;transform:rotate(0)}77.5%{top:5.952%;transform:rotate(0)}100%{top:calc(10.119% + var(--sink));transform:rotate(var(--twist))}}
@keyframes show-b{0%,35.82%{opacity:0}35.83%,100%{opacity:1}}
@keyframes working-b{0%,99.99%{opacity:1}100%{opacity:0}}
@keyframes done-b{0%,99.99%{opacity:0}100%{opacity:1}}
#run-a:checked ~ .workspace .camera{animation:camera-a 6s ease-in-out both}
@keyframes camera-a{0%,18%{transform:scale(1)}35%{transform:scale(1.14)}60%,78%{transform:scale(1.32)}100%{transform:scale(1)}}
#run-b:checked ~ .workspace .camera{animation:camera-b 6s ease-in-out both}
@keyframes camera-b{0%,18%{transform:scale(1)}35%{transform:scale(1.14)}60%,78%{transform:scale(1.32)}100%{transform:scale(1)}}
@media(max-width:600px){main{padding:18px}h1{font-size:44px}.brand{font-size:12px}.offline{font-size:12px}.controls{justify-content:center;gap:16px}.status{width:100%;text-align:center}.play{width:100%}.sound-row{justify-content:center}.hint{text-align:center}.scene{width:calc(100% + 36px);max-width:none;margin-left:-18px}}
</style>
</head>

</div>
<label class="play to-a" for="run-a"><span class="start">В шредер</span><span class="again">Ещё раз</span></label>
<label class="play to-b" for="run-b">Ещё раз</label>

</div>
</fieldset>
